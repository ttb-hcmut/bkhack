<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" type="image/x-icon" href="/assets/Group-16.ico?v1">
    <meta charset="utf-8" />
    <title>BKHack</title>
		<style>
@import "/styles/debug.css";
@import "/styles/reset.css";
@import "/styles/variables.css";
@import "/styles/widget-variables.css";
@import "/styles/components/headerbar.css";
@import "/styles/components/command.css";

html {
	font-size: var(--text-base);
	font-family: var(--font-mono);
}

#root {
	background-color: var(--global-bg);
	max-height: 100vh;
	min-height: 100vh;
	display: grid;
	grid-template-columns: auto minmax(10rem, 20rem) auto ;
	grid-template-rows: 1fr min-content max-content 1fr;
	gap: var(--space-a);
}

#root > .logo {
	width: 10rem;
	height: 6rem;
	grid-row: 1/2;
	grid-column: 2/3;
	display: grid;
	justify-self: center;
	align-self: end;
	place-items: center;
}

#root:not([data-tileset="gui"]) > .logo::after {
	content: "bkhack";
	font-size: var(--text-2xl);
}
#root[data-tileset="gui"] > .logo {
	content: " ";
	background-image: url("/assets/logo-full.svg");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}
#root > p {
    grid-row: 2/3;
    grid-column: 2/3;
    justify-self: center;
    color: var(--ctp-subtext1)
}

#root > main{
	font-size: var(--text-sm);
	border: 2px solid var(--border);
	border-radius: var(--radius);
	background-color: var(--card);
	color: var(--ctp-text);
	padding:1rem;
	display: grid;
	grid-row: 3/4;
	grid-column: 2/3;
	gap: var(--space-a);
}

main > form{
	display:grid;
	grid-column:1/3;
	gap: var(--space-a);
}

main > form > label{
	align-self:end;
	justify-self:start;
}

main > form > input{
	justify-self:center;
	font-family: inherit;
	color: var(--foreground);
	background-color: var(--input-background);
	border-radius: var(--radius);
	border: 0;
	justify-self:stretch;
	padding: var(--space-a);
}

main > form > input::placeholder{
    font-size: var(--text-base);
    font-family: inherit;
    color: color-mix(in srgb, var(--ctp-text), transparent 50%);
}
.error{
    color: var(--ctp-red);
    padding: var(--space-a);
	background-color: color-mix(in srgb, var(--ctp-red), transparent 80%);
	border: 2px solid var(--ctp-red);
}
main > form > button{
    justify-self:stretch;
	padding: var(--space-a);
    color: white;
    font-size: var(--text-base);
    font-family: inherit;
	background-color: var(--sig-blue);
	border-radius: var(--radius);
}
main > form > button:active{
	background-color: color-mix(in srgb, var(--sig-blue), transparent 50%);
}

main > span{
    grid-column:1/3;
    height:2px;
    background-color: var(--ctp-mantle)
}
main > a{
	justify-self:center;
	font-size: var(--text-sm);
	color: var(--ctp-subtext1);
	cursor: default;
}
main > a:hover{
	color: var(--primary);
}
main > a:active{
	color: color-mix(in srgb, var(--ctp-subtext1), transparent 50%);
}

main > form > button:disabled{
	background-color: transparent;
}
main.register > form > ul{
    background-color: var(--ctp-mantle);
    border-radius: var(--radius);
	padding: var(--space-a);
    font-size: var(--text-sm);
    color: var(--ctp-subtext1);
}
main.register > form > ul > li.invalid{
    color: var(--ctp-red);
    text-decoration:underline;
}
main.register > form > ul > li.invalid > span{
    text-decoration:none;
    opacity:0;
}


/* #root > .footer{
    background-color: #ff0000;
    grid-row: 4/5;
    grid-column: 2/3;

} */

		</style>
    <script type="module" src="index.js"></script>
	</head>
  <body>
    <div id="root" data-tileset="gui"></div>
  </body>
</html>
