<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BKHack</title>
		<style>
@import "/styles/debug.css";
@import "/styles/reset.css";
@import "/styles/variables.css";
@import "/styles/widget-variables.css";
@import "/styles/components/headerbar.css";
@import "/styles/components/command.css";

html {
	font-size: var(--text-base);
	font-family: var(--font-mono);
}

#root {
	background-color: var(--global-bg);
	min-height: 100vh;
	/* padding-bottom: var(--space-a); */
    display: grid;
    grid-template-columns: auto minmax(10rem, 30rem) auto ;
    grid-template-rows: min-content min-content max-content min-content;
}




#root > .logo {
	width: 10rem;
    height: 6rem;
    grid-row: 1/2;
    grid-column: 2/3;
    display: grid;
    justify-self: center;
    align-self: center;
    place-items: center;
}
#root:not([data-tileset="gui"]) > .logo::after {
	content: "BKHack";
    font-size: var(--text-2xl);
}
#root[data-tileset="gui"] > .logo {
	content: " ";
	background-image: url("/assets/logo.svg");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}
#root > p {
    grid-row: 2/3;
    grid-column: 2/3;
    justify-self: center;
    color: var(--ctp-subtext1)
}
#root > .main-container{
	border: 2px solid var(--ctp-mantle);
	border-radius: var(--radius);
	background-color: var(--ctp-crust);
	color: var(--ctp-text);
	padding:1rem;
    display: grid;
    grid-row: 3/4;
    grid-column: 2/3;
    gap: var(--space-a);

}
.main-container > form{
    display:grid;
    grid-column:1/3;
	margin: var(--space-a);
	gap: var(--space-a);
}
.main-container > form > label{
    align-self:end;
    justify-self:start;
}
.main-container > form > input{
    justify-self:center;
    font-size: var(--text-base);
    font-family: inherit;
    color: var(--ctp-text);
	background-color: var(--ctp-mantle);
	border-radius: var(--radius);
	border: 0;
    justify-self:stretch;
	padding: var(--space-a);
}
/* .main-container > form > input:focus{
    border:0;
    background-color: red;
} */
.main-container > form > input::placeholder{
    font-size: var(--text-base);
    font-family: inherit;
    color: color-mix(in srgb, var(--ctp-text), transparent 50%);
}
.error{
    color: var(--ctp-red);
    padding: var(--space-a);
	background-color: var(--ctp-rosewater);
	border: 2px solid var(--ctp-red);
}
.main-container > form > button{
    justify-self:stretch;
	padding: var(--space-a);
    color: white;
    font-size: var(--text-base);
    font-family: inherit;
	background-color: var(--sig-blue);
	border-radius: var(--radius);
}
.main-container > form > button:active{
	background-color: color-mix(in srgb, var(--sig-blue), transparent 50%);
}

.main-container > span{
    grid-column:1/3;
    height:2px;
    background-color: var(--ctp-mantle)
}
.main-container > a{
    justify-self:center;
    font-size: var(--text-sm);
    color: var(--ctp-subtext1);
}
.main-container > a:hover{
    text-decoration:underline;
}
.main-container > a:active{
	color: color-mix(in srgb, var(--ctp-subtext1), transparent 50%);
}

.main-container > form > button:disabled{
	background-color: transparent;
}
.main-container.register > form > ul{
    background-color: var(--ctp-mantle);
    border-radius: var(--radius);
	padding: var(--space-a);
    font-size: var(--text-sm);
    color: var(--ctp-subtext1);
}
.main-container.register > form > ul > li.invalid{
    color: var(--ctp-red);
    text-decoration:underline;
}


#root > .footer{
    background-color: #ff0000;
    grid-row: 4/5;
    grid-column: 2/3;

}

		</style>
    <script type="module" src="index.js"></script>
	</head>
  <body>
    <div id="root" data-tileset="gui"></div>
  </body>
</html>
