		<style>
@import "/styles/debug.css";
@import "/styles/reset.css";
@import "/styles/variables.css";
@import "/styles/widget-variables.css";
@import "/styles/components/headerbar.css";
@import "/styles/components/sidebar.css";
@import "/styles/components/command.css";
@import "nav.css";
@import "article.css";
@import "discussion.css";
@import "pullrequests.css";


html {
	font-size: var(--text-base);
	font-family: system-ui;
}

#root {
	background-color: var(--global-bg);
	min-height: 100vh;
	padding-bottom: var(--space-a);
}

#root > nav {
	background-color: var(--card-bg);
	border: solid 1px var(--card-border);
  z-index: 9;
  position: relative;
	background-color: var(--ctp-crust);
	display: flex;
	flex-direction: row;
	border-radius: var(--radius);
	border-top: 1px solid var(--card-border);
	border-bottom: 1px solid var(--card-border);
	height: 2rem;
  margin-top: var(--radius);
	margin-left: var(--space-a);
	margin-right: var(--space-a);
	border-radius: 0.5rem 0.5rem 0 0;
	border-top: 1px solid var(--card-border);
	border-left: 1px solid var(--card-border);
	border-right: 1px solid var(--card-border);
	background-color: var(--card-bg-translucent);
}

#root > main {
	margin-left: var(--space-a);
	margin-right: var(--space-a);
  padding-bottom: var(--radius);
	border-radius: 0 0 0.5rem 0.5rem;
	border-left: 1px solid var(--card-border);
	border-right: 1px solid var(--card-border);
	border-bottom: 1px solid var(--card-border);
	background-color: var(--card-bg-translucent);
}

#root > main.discussions,
#root > main.pullrequests {
	background-color: var(--card-bg);
}

.comments {
  /* border: 2px solid white; */
  display: grid;
  grid-template-columns: min-content auto;
  grid-template-rows: repeat(auto);
}
.comments > .content {
  grid-column: 1/3;
  grid-row: 1/2;
}
.comments > .show-replies {
  grid-column: 1/3;
  grid-row: 2/3;
  color: white;
  width: max-content;
}
.comments > .more-replies {
  grid-column: 1/3;
  grid-row: 4/5;
  color: white;
  width: max-content;
}
.comments  > .spacer {
  width: var(--space-a);
  grid-column: 1/2;
  grid-row: 3/4;
  border-left: 2px solid white;
}
.comments > .replies {
  grid-column: 2/3;
  grid-row: 3/4;
}

#root > main.article > *.only:not(.article),
#root > main.discussions > *.only:not(.discussions),
#root > main.pullrequests > *.only:not(.pullrequests),
#root > main.log > *.only:not(.log),
#root > main.edit > *.only:not(.edit) {
	display: none;
}

@media (min-width: 64rem) {
	:root {
		/* NOTE(kinten): make sure to manually sync these values */
		--grid-1: minmax(0,1fr) minmax(0,calc(64rem - 300px)) minmax(0,400px)  minmax(0,1fr);
		--offset: calc((100vw - (64rem - 300px + 400px - 2 * var(--space-a))) / 2);
	}

	#root {
		display: grid;
		grid-auto-rows: max-content;
		grid-template-columns: var(--grid-1);
		gap: var(--space-a);
	}

	/* #root > * {
		grid-column: 2 / 3;
	} */

	#root > header {
		grid-column: 1 / -1;
		padding-left: var(--offset);
		padding-right: var(--offset);
	}
	#root > nav {
		grid-column: 2 / 3;
		grid-row: 2 / 3;
		margin: 0;
	}
	#root > main {
		margin: 0;
	  margin-top: calc(-1 * var(--space-a));
		grid-column: 2 / 3;
		grid-row: 3 / 4;
	}
	#root > aside {
		display: block !important;
		grid-column: 3 / 4;
		grid-row: 3 / 7;
		width: unset;
		height: unset;
		margin-top: unset;
		left: unset;
		transform: unset;
	}
	#root > .show-hide-sidebar{
    font-family: var(--font-mono);
		position: unset;
		grid-column: 3 / 4;
		grid-row: 2 / 3;
		padding: var(--space-a);
  	justify-self: end;
		background-color: var(--card-bg);
		border: solid 1px var(--card-border);
		border-radius: var(--radius);
		padding: var(--space-a);
	}
}
	

#root .show-hide-sidebar {
	height: 2rem;
}

/* Show hide sidebar system */
	
/* if mobile state1 => show, state0 => hide */

@media (max-width: 64rem) {
	#root > .show-hide-sidebar.state1::after{
		content: "Hide Sidebar";
	}
	body:has(.state1){
		overflow: hidden;
	}
	#root:has(.state1) > *:not(aside):not(.show-hide-sidebar){
		/* filter: brightness(50%); */
		pointer-events: none;     /* block clicks */
		user-select: none;
	}
	/* TODO: figure out how to make the track of the scrollbar
			 invisible but the thumb visible */
	#root > aside.state1{
		display: block;
		position: fixed;
		overflow-y: auto;
		/* height: 80vh;*/
		top: 6rem;
	}
	#root > .show-hide-sidebar.state0::after{
		content: "Show Sidebar";
	}
}
/* if desktop state0 => show, state1 => hide */
@media (min-width: 64rem) {

	/* #root > * {
		grid-column: 2 / 3;
	} */

	#root > nav.state0 {
		grid-column: 2 / 3;
	}
	#root > main.state0 {
		grid-column: 2 / 3;
	}
	#root > footer.state0 {
		grid-column: 2 / 3;
	}
	#root > .show-hide-sidebar.state0::after{
		content: "Hide Sidebar";
	}
	#root > aside.state0 {
		display: block !important;
		grid-column: 3 / 4;
	}

	#root > nav.state1 {
		grid-column: 2 / 4;
	}
	#root > main.state1 {
		grid-column: 2 / 4;
	}
	#root > footer.state1 {
		grid-column: 2 / 4;
	}
	#root > .show-hide-sidebar.state1::after{
		content: "Show Sidebar";
	}
	/* #root > .show-hide-sidebar.state1{
	} */
	#root > aside.state1 {
		display: none !important;
		grid-column: 3 / 4;
	}
	

}
