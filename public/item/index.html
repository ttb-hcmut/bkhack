<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Post</title>
		<style>
@import "/styles/debug.css";
@import "/styles/reset.css";
@import "/styles/variables.css";
@import "/styles/widget-variables.css";
@import "/styles/components/headerbar.css";
@import "/styles/components/sidebar.css";
@import "/styles/components/command.css";
@import "/styles/pages/page__item/nav.css";
@import "/styles/pages/page__item/article.css";
@import "/styles/pages/page__item/discussion.css";


html {
	font-size: var(--text-base);
	font-family: system-ui;
}

#root {
	background-color: var(--global-bg);
	min-height: 100vh;
	padding-bottom: var(--space-a);
}

#root > nav {
	background-color: var(--card-bg);
	border: solid 1px var(--card-border);
  z-index: 9;
  position: relative;
	background-color: var(--ctp-crust);
	display: flex;
	flex-direction: row;
	border-radius: var(--radius);
	border-top: 1px solid var(--card-border);
	border-bottom: 1px solid var(--card-border);
	height: max-content;
}

#root > main {
	margin-top: calc(-1 * (var(--radius)));
  padding-top: var(--radius);
	/* margin-left: var(--space-a);
	margin-right: var(--space-a); */
	border-left: 1px solid var(--card-border);
	border-right: 1px solid var(--card-border);
	border-bottom: 1px solid var(--card-border);
	border-radius: 0 0 0 0;
}

#root > main.article > *.only:not(.article),
#root > main.discussions > *.only:not(.discussions),
#root > main.pullrequests > *.only:not(.pullrequests),
#root > main.log > *.only:not(.log) {
	display: none;
}

@media (min-width: 64rem) {
	:root {
		/* NOTE(kinten): make sure to manually sync these values */
		--grid-1: minmax(0,1fr) minmax(0,calc(64rem - 300px)) minmax(0,400px)  minmax(0,1fr);
		--offset: calc((100vw - (64rem - 300px + 400px - 2 * var(--space-a))) / 2);
	}

	#root {
		display: grid;
		grid-auto-rows: max-content;
		grid-template-columns: var(--grid-1);
		gap: var(--space-a);
	}

	/* #root > * {
		grid-column: 2 / 3;
	} */

	#root > header {
		grid-column: 1 / -1;
		padding-left: var(--offset);
		padding-right: var(--offset);
	}
	#root > nav {
		grid-column: 2 / 3;
		grid-row: 2 / 3;
	}
	#root > main {
	  margin-top: calc(-1 * (var(--radius) + var(--space-a)));
		grid-column: 2 / 3;
		grid-row: 3 / 4;
	}
	#root > aside {
		display: block !important;
		grid-column: 3 / 4;
		grid-row: 3 / 7;
		width: unset;
		height: unset;
		margin-top: unset;
		left: unset;
		transform: unset;
	}
	#root > .show-hide-sidebar{
    font-family: var(--font-mono);
		position: unset;
		grid-column: 3 / 4;
		grid-row: 2 / 3;
		padding: var(--space-a);
  	justify-self: end;
		background-color: var(--card-bg);
		border: solid 1px var(--card-border);
		border-radius: var(--radius);
		padding: var(--space-a);
	}
}
	

	/* Show hide sidebar system */
	
/* if mobile state1 => show, state0 => hide */

@media (max-width: 64rem) {
	#root > .show-hide-sidebar.state1::after{
		content: "Hide Sidebar";
	}
	body:has(.state1){
		overflow:hidden;
	}
	#root:has(.state1) > *:not(aside):not(.show-hide-sidebar){
		filter: brightness(50%);
		pointer-events: none;     /* block clicks */
		user-select: none;
	}
	/* TODO: figure out how to make the track of the scrollbar
			 invisible but the thumb visible */
	#root > aside.state1{
		display: block;
		position: fixed;
		overflow-y: auto;
		/* height: 80vh;*/
		top: 6rem;
	}
	#root > .show-hide-sidebar.state0::after{
		content: "Show Sidebar";
	}
}
	/* if desktop state0 => show, state1 => hide */
	@media (min-width: 64rem) {

	/* #root > * {
		grid-column: 2 / 3;
	} */

	#root > nav.state0 {
		grid-column: 2 / 3;
	}
	#root > main.state0 {
		grid-column: 2 / 3;
	}
	#root > footer.state0 {
		grid-column: 2 / 3;
	}
	#root > .show-hide-sidebar.state0::after{
		content: "Hide Sidebar";
	}
	#root > aside.state0 {
		display: block !important;
		grid-column: 3 / 4;
	}

	#root > nav.state1 {
		grid-column: 2 / 4;
	}
	#root > main.state1 {
		grid-column: 2 / 4;
	}
	#root > footer.state1 {
		grid-column: 2 / 4;
	}
	#root > .show-hide-sidebar.state1::after{
		content: "Show Sidebar";
	}
	/* #root > .show-hide-sidebar.state1{
	} */
	#root > aside.state1 {
		display: none !important;
		grid-column: 3 / 4;
	}
	

}

		</style>
    <script type="module" src="index.js"></script>
	</head>
  <body>
    <div id="root" data-tileset="gui"></div>
  </body>
</html>
