@import "/styles/variables.css";

@import "/styles/components/headerbar.css";

@import "/styles/pages/page__item/discussion.css";
@import "/styles/pages/page__item/pullrequests.css";
@import "/styles/pages/page__item/edit.css";

html {
	font-size: var(--text-base);
	font-family: system-ui;
}

#root {
	background-color: var(--global-bg);
	min-height: 100vh;
  display:flex;
  flex-direction: column;
  gap: var(--space-a);
	padding-bottom: var(--space-a);
}

#root > main {
	margin-left: var(--space-a);
	margin-right: var(--space-a);
  padding-bottom: var(--radius);
	border-radius: var(--radius) var(--radius);
	border-left: 1px solid var(--card-border);
	border-right: 1px solid var(--card-border);
	border-bottom: 1px solid var(--card-border);
	background-color: var(--card-bg-translucent);
	margin-top: calc(-2rem);
	padding-top: 2rem;
}

#root > main.discussions,
#root > main.pullrequests {
	background-color: var(--card-bg);
}

	margin-left: calc(var(--space-a) + 2rem);

	margin-left: calc(var(--space-a) + 3rem);

#root > .innerbody.discussions > main > ol > li.level-4 > article {
	margin-left: calc(var(--space-a) + 4rem);

#root > .innerbody.discussions > main > ol > li > article > .content {
} */

#root > main.article > *.only:not(.article),
#root > main.discussions > *.only:not(.discussions),
#root > main.pullrequests > *.only:not(.pullrequests),
#root > main.pullrequests:not(.inspect) > *.only.pullrequests.inspect,
#root > main.pullrequests.inspect > *.only:not(.pullrequests.inspect),
#root > main.log > *.only:not(.log),
#root > main.edit > *.only:not(.edit) {
	display: none;
}

@media (min-width: 64rem) {
	:root {
		/* NOTE(kinten): make sure to manually sync these values */
		--grid-1: minmax(0,1fr) minmax(0,calc(64rem - 300px)) minmax(0,400px)  minmax(0,1fr);
		--offset: calc((100vw - (64rem - 300px + 400px - 2 * var(--space-a))) / 2);
	}

	#root {
		display: grid;
		grid-auto-rows: max-content;
		grid-template-columns: var(--grid-1);
		gap: var(--space-a);
	}

	/* #root > * {
		grid-column: 2 / 3;
	} */

	#root > header {
		grid-column: 1 / -1;
		padding-left: var(--offset);
		padding-right: var(--offset);
	}
	#root > nav {
		grid-column: 2 / 3;
		grid-row: 2 / 3;
		margin: 0;
	}
	#root > main {
		margin: 0;
		margin-top: calc(-2rem - var(--space-a));
		grid-column: 2 / 3;
		grid-row: 3 / 4;
	}
}


/* Show hide sidebar system */
	
/* if mobile state1 => show, state0 => hide */

@media (max-width: 64rem) {
	body:has(.state1){
		overflow: hidden;
	}
	#root:has(.state1) > *:not(aside):not(.show-hide-sidebar){
    filter: brightness(50%);
		pointer-events: none;     /* block clicks */
		user-select: none;
	}
	#root:has(.state1){
		background-color: color-mix(in srgb, var(--global-bg), black 50%);
	}
}
/* if desktop state0 => show, state1 => hide */
@media (min-width: 64rem) {

	/* #root > * {
		grid-column: 2 / 3;
	} */

	#root > nav.state0 {
		grid-column: 2 / 3;
	}
	#root > main.state0 {
		grid-column: 2 / 3;
	}
	#root > footer.state0 {
		grid-column: 2 / 3;
	}

	#root > nav.state1 {
		grid-column: 2 / 4;
	}
	#root > main.state1 {
		grid-column: 2 / 4;
	}
	#root > footer.state1 {
		grid-column: 2 / 4;
	}
	

}
  *:disabled:hover {
    color: unset
  }
		</style>
    <script type="module" src="index.js"></script>

    <div id="root" data-tileset="gui"></div>
