# fly.toml app configuration file generated for bkhack on 2026-05-24T18:55:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bkhack'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
	grace_period = "100s"
	interval = "300s"
	method = "GET"
	timeout = "50s"
	path = "/"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
