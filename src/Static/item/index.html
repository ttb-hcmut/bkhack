<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/assets/Group-16.ico?v1">
		<style>
@import "/styles/debug.css";
@import "/styles/reset.css";
@import "/styles/variables.css";
@import "/styles/widget-variables.css";
@import "/styles/components/headerbar.css";
@import "/styles/components/sidebar.css";
@import "/styles/components/command.css";
@import "/styles/components/markdown.css";
@import "/styles/pages/page__item/nav.css";
@import "/styles/pages/page__item/article.css";
@import "/styles/pages/page__item/discussion.css";
@import "/styles/pages/page__item/pullrequests.css";
@import "/styles/pages/page__item/edit.css";
@import "/styles/pages/page__item/log.css";
@import "/styles/components/pagination.css";

html {
	font-size: var(--text-base);
	font-family: system-ui;
}

#root {
	background-color: var(--global-bg);
	min-height: 100vh;
  display:flex;
  flex-direction: column;
  gap: var(--space-a);
	padding-bottom: var(--space-a);
}

#root > main {
	margin-left: var(--space-a);
	margin-right: var(--space-a);
  padding-bottom: var(--radius);
	border-radius: var(--radius) var(--radius);
	border-left: 1px solid var(--card-border);
	border-right: 1px solid var(--card-border);
	border-bottom: 1px solid var(--card-border);
	background-color: var(--card-bg-translucent);
  margin-top: calc(-2rem - var(--space-a));
	padding-top: 2rem;
}

#root > main.discussions,
#root > main.pullrequests {
	background-color: var(--card-bg);
}



#root > main.article > *.only:not(.article),
#root > main.discussions > *.only:not(.discussions),
#root > main.pullrequests > *.only:not(.pullrequests),
#root > main.pullrequests:not(.inspect) > *.only.pullrequests.inspect,
#root > main.pullrequests.inspect > *.only:not(.pullrequests.inspect),
#root > main.log > *.only:not(.log),
#root > main.edit > *.only:not(.edit) {
	display: none;
}

#root[data-help-visibility="visible"] {
  width: 100vw;
  height: 100vh;
  max-height: 100vh;
  padding: 0;
  overflow: hidden;
}

#root > dialog.help {
  transition-property: all;
  transition-duration: 300ms;
  position: fixed;
  width: 100vw;
  height: 100vh;
  max-height: 100vh;
  overflow: hidden;
  background-color: rgba(100,100,100,0.2);
  opacity: 0%;
  z-index: 10000;
  pointer-events: none;
}

@media (prefers-reduced-motion) {
  #root > dialog.help {
		transition-property: none;
		transition-duration: 0ms;
  }
}

#root[data-help-visibility="visible"] > dialog.help {
  pointer-events: auto;
  opacity: 100%;
}

/* desktop */
dialog.help > div {
  position: relative;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: green;
  min-width: 32rem;
  min-height: 32rem;
}

/* mobile - tablet */
@media (max-width: 84rem) {
  dialog.help > div {
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
  }

  dialog.help > div {
		min-width: 36rem;
		min-height: 20rem;
		max-height: 22rem;
    height: fit-content;
    background-color: var(--card-bg);
    color: var(--card-fg);
    border: solid 1px var(--card-border);
    border-radius: 0px;
    display: grid;
    grid-template-rows: max-content minmax(0,1fr);
  }

  dialog.help > div > header {
    margin-top: var(--space-a);
    margin-left: var(--space-a);
    margin-right: var(--space-a);
    display: grid;
    grid-template-columns: 2.5rem minmax(0,1fr) max-content;
    grid-template-rows: max-content max-content;
  }

  dialog.help > div > header > .icon {
    grid-row: 1 / -1;
    grid-column: 1 / 2;
  }

  dialog.help > div > header > h1 {
    grid-row: 1 / 2;
    grid-column: 2 / 3;
  }

  dialog.help > div > header > h1::before {
    color: var(--card-fg);
    font-size: var(--text-sm);
    font-family: var(--font-mono);
    content: "quick manual";
  }

  dialog.help > div > header > .sub {
    grid-row: 2 / 3;
    grid-column: 2 / 3;
  }

  dialog.help > div > header > button.close {
    grid-row: 1 / -1;
    grid-column: 3 / 4;
  }

  dialog.help > div > header > .sub::before {
	  font-size: var(--text-xs);
	  color: var(--card-fg-aux);
    font-family: var(--font-mono);
    content: "$ help";
  }

  dialog.help > div > header > button.close > label::before {
	  color: var(--card-fg-aux);
    font-family: var(--font-mono);
    content: "close";
  }

  dialog.help > div > main {
    display: flex;
    flex-wrap: wrap;
    flex-direction: column;
    margin-right: var(--space-a);
    margin-top: var(--space-a);
    overflow-x: auto;
  }

  dialog.help > div > main > section {
    width: calc((100% / 2) - 2px);
    padding-bottom: var(--space-a);
  }

  dialog.help > div > main > section > h2 {
    margin-left: var(--space-a);
    margin-right: var(--space-a);
    margin-bottom: var(--space-a);
  }

  dialog.help > div > main > section > article {
    background-color: var(--card-bg-translucent);
    border: solid 1px var(--card-border);
    margin-left: var(--space-a);
    padding-top: var(--space-f);
    padding-bottom: var(--space-f);
  }

  dialog.help > div > main > section > article:not(:nth-of-type(1)) {
    margin-top: var(--space-a);
  }

  dialog.help > div > main > section > article > * {
    display: block;
    margin-left: var(--space-a);
    margin-right: var(--space-a);
  }

  dialog.help > div > main > section > article > .description {
    color: var(--card-fg-aux);
  }

}

/* mobile - phone */
@media (max-width: 48rem) {
  dialog.help > div {
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		background-color: red;
		min-width: 16rem;
		min-height: 16rem;
  }
}

@media (min-width: 64rem) {
	:root {
		/* NOTE(kinten): make sure to manually sync these values */
		--grid-1: minmax(0,1fr) minmax(0,calc(64rem - 300px)) minmax(0,400px)  minmax(0,1fr);
		--offset: calc((100vw - (64rem - 300px + 400px - 2 * var(--space-a))) / 2);
	}

	#root {
		display: grid;
		grid-auto-rows: max-content;
		grid-template-columns: var(--grid-1);
		gap: var(--space-a);
	}

	/* #root > * {
		grid-column: 2 / 3;
	} */

	#root > header {
		grid-column: 1 / -1;
		padding-left: var(--offset);
		padding-right: var(--offset);
	}
	#root > nav {
		grid-column: 2 / 3;
		grid-row: 2 / 3;
		margin: 0;
	}
	#root > main {
		margin: 0;
		margin-top: calc(-2rem - var(--space-a));
		grid-column: 2 / 3;
		grid-row: 3 / 4;
	}
}

/* Show hide sidebar system */
	
/* if mobile state1 => show, state0 => hide */

@media (max-width: 64rem) {
	body:has(.state1){
		overflow: hidden;
	}
	#root:has(.state1) > *:not(aside):not(.show-hide-sidebar){
    filter: brightness(50%);
		pointer-events: none;     /* block clicks */
		user-select: none;
	}
	#root:has(.state1){
		background-color: color-mix(in srgb, var(--global-bg), black 50%);
	}
}
/* if desktop state0 => show, state1 => hide */
@media (min-width: 64rem) {

	/* #root > * {
		grid-column: 2 / 3;
	} */

	#root > nav.state0 {
		grid-column: 2 / 3;
	}
	#root > main.state0 {
		grid-column: 2 / 3;
	}
	#root > footer.state0 {
		grid-column: 2 / 3;
	}

	#root > nav.state1 {
		grid-column: 2 / 4;
	}
	#root > main.state1 {
		grid-column: 2 / 4;
	}
	#root > footer.state1 {
		grid-column: 2 / 4;
	}
	

}

		</style>
    <script type="module" src="index.js"></script>
	</head>
  <body>
    <div id="root" data-tileset="gui"></div>
  </body>
</html>
